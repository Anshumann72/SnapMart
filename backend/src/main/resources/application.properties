# NOTE FOR DEVELOPERS:
# The required application settings have been removed for security.
# Please create your own local 'application.properties' and add the following:

# ----------------------------------------------------------
# DATABASE CONFIGURATION
# spring.datasource.url=jdbc:postgresql://<HOST>:5432/<DB_NAME>
# spring.datasource.username=<DB_USERNAME>
# spring.datasource.password=<DB_PASSWORD>
# spring.jpa.hibernate.ddl-auto=update
# spring.jpa.database-platform=org.hibernate.dialect.PostgreSQLDialect
# ----------------------------------------------------------

# ----------------------------------------------------------
# JWT CONFIGURATION
# spring.app.jwtSecret=<YOUR_JWT_SECRET>
# spring.app.jwtExpirationMs=300000000
# spring.ecom.app.jwtCookieName=springBootEcom
# ----------------------------------------------------------

# ----------------------------------------------------------
# IMAGE STORAGE CONFIG
# project.image=images/
# image.base.url=http://localhost:8080/images
# ----------------------------------------------------------

# ----------------------------------------------------------
# FRONTEND URL
# frontend.url=http://localhost:5173/
# ----------------------------------------------------------

# ----------------------------------------------------------
# STRIPE CONFIG
# stripe.secret.key=${STRIPE_SECRET_KEY}
# (Set STRIPE_SECRET_KEY in your system environment variables)
# ----------------------------------------------------------

# DO NOT commit actual credentials or secret keys to GitHub.
